name: 打包并发布

# 推一个 v 开头的 tag（比如 v1.0.0）就触发全套打包：四个平台并行构建，
# 最后一个 job 把产物挂到同名的 Release 上。
#
# 为什么非得在 CI 里跑：macOS 的 .pkg 只能用 pkgbuild、Linux 的 .deb 只能用
# dpkg-deb，两个都**不跨平台** —— 在 Windows 开发机上做不出来，只能各自在
# 原生系统上构建。Windows 那个 .exe 安装包反而是哪儿都能编（用系统自带的 csc.exe）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 建 Release、传附件要写权限

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          # 两个 macOS 目标都跑在 macos-14（Apple Silicon）上 —— 包括 x64 那个。
          # 打包这一步不编任何东西：x64 的 Node 运行时是从 nodejs.org 下载的 tar 包，
          # pkgbuild 也只是照着目录树封包，跟宿主是哪个架构没关系。
          # 别为了「x64 就该在 Intel 机器上打」改用 macos-13：那批 Intel runner 已经很
          # 边缘了，实测排队 20 分钟都等不到机器，而 release job 要等所有构建完成才发。
          - os: macos-14
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # express 是唯一的运行依赖；node_modules 不进仓库，构建前必须先装
      - run: npm ci

      # 下载官方 Node 运行时（核对 SHASUMS256.txt 里的 SHA-256）、组装、
      # 打便携包；Windows 上还会顺手编出 .exe 安装包。
      - run: node packaging/build.mjs --target ${{ matrix.target }}

      # macOS / Linux 再包一层平台安装包（.pkg / .deb）。Windows 上这条直接跳过。
      - name: 打平台安装包
        shell: bash
        run: bash packaging/make-installer.sh ${{ matrix.target }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # 只取最终产物。dist/ 里还有几百 MB 的下载缓存和 stage 目录，不能一起传。
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.pkg
            dist/*.deb
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release、附校验和
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist

          # 产物不小（每个平台 30MB 上下），给一份校验和方便下载后核对
          (cd dist && sha256sum *.zip *.exe *.tar.gz *.pkg *.deb > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          # 用变量是为了下面那条 || 兜底能复用同一份文件列表（这里要 glob 展开，别加引号）
          files="dist/*.zip dist/*.exe dist/*.tar.gz dist/*.pkg dist/*.deb dist/SHA256SUMS.txt"

          # 万一这个 tag 下已经有 Release 了（比如某次运行的 job 卡在排队里、后来才跑完），
          # 就改成覆盖附件，别让整个 job 因为「已存在」而挂掉
          gh release create "${GITHUB_REF_NAME}" \
            --title "AI 问答网站 ${GITHUB_REF_NAME}" \
            --notes-file packaging/release-notes.md \
            $files \
          || gh release upload "${GITHUB_REF_NAME}" --clobber $files
