name: 想要个功能
description: 建议一个新功能或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚：这个项目刻意做得很小 —— **全站只有 `express` 一个依赖，前端没有构建步骤**。
        需要引入第三方库的建议，请先说明为什么原生写法做不到。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景和痛点，别急着说方案。这样更容易看出有没有更简单的做法。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过或想过的替代方案
      description: 包括「不改代码也能绕过去」的办法。
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这个功能不需要引入新的第三方依赖（或者我已经说明为什么必须引）
          required: false
