<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<!-- 下面这行由服务端现场替换成 <title> / 站点图标 / 分享卡片 meta，见 server.js 的 pageHead() -->
<!-- %HEAD% -->
<link rel="stylesheet" href="/assets/style.css" />
<link rel="stylesheet" href="/assets/motion.css" />
</head>
<body>

<!-- ==================== 秘钥验证 ==================== -->
<div id="gate" class="gate hidden">
  <div class="gate-card">
    <div class="gate-brand">
      <div class="brand-badge" id="gateAvatar">AI</div>
      <h1 id="gateTitle">AI 助手</h1>
      <p class="gate-sub">请输入访问秘钥以继续</p>
    </div>

    <form id="gateForm" autocomplete="off">
      <div class="code-input" id="codeInput">
        <input class="code-cell" inputmode="text" maxlength="1" aria-label="秘钥第 1 位" />
        <input class="code-cell" inputmode="text" maxlength="1" aria-label="秘钥第 2 位" />
        <input class="code-cell" inputmode="text" maxlength="1" aria-label="秘钥第 3 位" />
        <input class="code-cell" inputmode="text" maxlength="1" aria-label="秘钥第 4 位" />
        <input class="code-cell" inputmode="text" maxlength="1" aria-label="秘钥第 5 位" />
      </div>

      <p class="gate-error" id="gateError" role="alert"></p>

      <button type="submit" class="btn btn-primary btn-block" id="gateSubmit">进入</button>
    </form>

    <p class="gate-foot">秘钥由管理员发放，共 5 位</p>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-badge small" id="sideAvatar">AI</div>
      <span class="side-name" id="sideName">AI 助手</span>
    </div>

    <button class="btn btn-new" id="newChat">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新对话
    </button>

    <nav class="history" id="history" aria-label="历史对话"></nav>

    <div class="side-foot">
      <button class="side-btn side-btn-exit" id="logoutBtn" title="退出并清空本机保存的对话记录">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        退出登录
      </button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="chat-title">
        <span class="dot"></span>
        <span id="chatTitle">AI 助手</span>
        <span class="preview-badge hidden" id="previewBadge">预览模式</span>
      </div>
      <div class="chat-actions">
        <button class="icon-btn" id="clearBtn" title="清空当前对话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="给 AI 发送消息…" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="发送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
        <!-- 生成中顶替「发送」占同一个位置，不用多长一个按钮出来（见 app.js 的 setStreaming） -->
        <button type="button" class="stop-btn hidden" id="stopBtn" aria-label="停止生成" title="停止生成（Esc）">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.6"/></svg>
        </button>
      </form>
      <p class="composer-hint">Enter 发送 · Shift + Enter 换行 · AI 生成内容仅供参考</p>
    </div>
  </main>

  <!-- 抽屉遮罩。它必须待在 #app **里面**：showView('app') 会给 #app 挂 .app-enter，
       而那条动画动的是 opacity —— 只要动画还在生效，Chrome 就认定 #app 是一个层叠上下文，
       哪怕动画已经跑完（实测 playState 是 finished、计算 opacity 也是 1，这个上下文照样留着）。
       抽屉的 z-index: 40 于是被锁死在 #app 这个上下文里，出不去；遮罩要是还挂在 body 下、
       当 #app 的兄弟，它那个 z-index: 35 就压在**整个 #app 子树**上面 —— 连着抽屉一起压暗，
       抽屉里任何东西都点不动。挪进来之后 40 > 35 才是在同一层里比大小，
       而且以后往 #app 上再加什么动画都不会再犯这个错。
       常驻元素切 .show，关的时候才能淡出（见 app.js 的 openSidebar / closeSidebar）。 -->
  <div class="backdrop" id="backdrop"></div>
</div>

<!-- 首次加载：徽标 + 两圈错峰扩散的光环 + 一条进度微光 -->
<div id="boot" class="boot">
  <div class="boot-mark">
    <span class="boot-ring"></span>
    <span class="boot-ring"></span>
    <div class="brand-badge boot-badge" id="bootBadge">AI</div>
  </div>
  <div class="boot-bar"><i></i></div>
</div>

<div id="toast" class="toast" role="status"></div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
